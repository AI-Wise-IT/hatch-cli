name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # ADR-0014/ADR-0024: retroactive-collision guard. Always reports a status
  # (so it's safe as a required check even when a PR doesn't touch
  # harness-registry/resolution code — a path-filtered *trigger* would
  # otherwise never report on unrelated PRs and block them forever). Only
  # clones hatch-skills and runs the real check when something relevant
  # changed.
  collision-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether harness-registry/resolution logic changed
        id: filter
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > changed-files.txt
          cat changed-files.txt
          if grep -qE '^src/(harness-registry\.(json|ts)|registry/(group-resolve|collision-check)\.ts)$' changed-files.txt; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.relevant == 'true'
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: steps.filter.outputs.relevant == 'true'
      - run: npm run build
        if: steps.filter.outputs.relevant == 'true'
      - name: Checkout hatch-skills (read-only credential)
        if: steps.filter.outputs.relevant == 'true'
        uses: actions/checkout@v4
        with:
          repository: AI-Wise-IT/hatch-skills
          token: ${{ secrets.HATCH_SKILLS_READ_TOKEN }}
          path: hatch-skills-checkout
      - name: Run collision check against hatch-skills
        if: steps.filter.outputs.relevant == 'true'
        run: node dist/index.js check-collisions --registry-path hatch-skills-checkout
      - name: No harness-registry/resolution changes in this PR
        if: steps.filter.outputs.relevant == 'false'
        run: echo "Skipping — nothing relevant to the collision check changed."

  # ADR contract enforcement (docs/architecture/decisions/README.md). Runs the
  # whole record set's conformance check, the frozen-section immutability check,
  # and every machine check whose declared context is the CLI repo or both.
  # Unlike collision-check this needs no path filter: conformance is evaluated
  # across the whole corpus on every PR by design, so the job always has work
  # and always reports a status.
  decision-records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # ADR-0014's shape: a checkout scoped by the same Contents-read token.
      # Only a record declaring context `both` reads it; none does today, and
      # the checkout is here so one can without a workflow change.
      - name: Checkout hatch-skills (read-only credential)
        uses: actions/checkout@v4
        with:
          repository: AI-Wise-IT/hatch-skills
          token: ${{ secrets.HATCH_SKILLS_READ_TOKEN }}
          path: hatch-skills-checkout
      - name: Conformance, and every check whose context is this repo
        run: node scripts/adr/check.mjs --repo cli --registry hatch-skills-checkout
      - name: Frozen sections of accepted records are unedited
        if: github.event_name == 'pull_request'
        run: |
          node scripts/adr/check-immutability.mjs \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"
      - name: Push to main — immutability has no pull request to compare
        if: github.event_name != 'pull_request'
        run: |
          echo "Skipping the immutability check: it compares a pull request against its merge base."
